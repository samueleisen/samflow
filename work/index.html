<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Hub - Workspace</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/work.css">
    <link rel="icon" type="image/png" href="./src/flow-logo3.png">
</head>
<body class="workspace-page" data-page="work">
    <main class="content">
        <section class="workspace-shell" aria-label="Project tracker">
            <form class="task-entry" id="task-form" autocomplete="off">
                <input
                    id="task-input"
                    class="task-input"
                    type="text"
                    maxlength="120"
                    placeholder="Add a new project"
                    aria-label="Add a new project"
                />
            </form>

            <ul class="task-list" id="task-list" aria-label="Current projects" aria-live="polite"></ul>
            <p class="task-empty" id="task-empty">No projects yet.</p>
        </section>
    </main>

    <script type="module" src="/nav.js"></script>
    <script type="module" src="/work.js"></script>
</body>
</html>
